# Guide playbook — lead decides when to spawn; not a hard pipeline.
# Self-contained copy for this fixture so `agent-team start --playbook
# new-feature` works when run from the project dir (mirrors the bundled
# new-feature playbook; kept in-tree intentionally per the S10 E2E layout).
name: new-feature
description: New feature — plan, implement, test, review
mode: guide

suggested_teammates:
  - persona: planner
    when: start
    prompt: |
      Read TEAM.md. Produce a task breakdown in docs/plans/{feature}.md.
      Create tasks. Do not write production code.

  - persona: implementer
    when: after_task_plan_ready
    prompt: |
      Implement tasks from the task board. Claim before work.
      Run pytest after each task. Mail lead on blockers.

  - persona: tester
    when: after_implementation
    prompt: |
      Run the test commands from TEAM.md. Report failures to implementer via mail.

  - persona: reviewer
    when: before_done
    prompt: |
      Review the diff for correctness, errors, and style. Request changes via mail.

lead_instructions: |
  This playbook is a GUIDE, not a mandatory pipeline.
  You decide which personas to spawn and when (within allowed_personas, max 5).
  Spawn only with user TUI approval.
  Shutdown teammates when their stage is done.
  Summarize for the user before exit.

done_criteria:
  - all tasks completed
  - pytest passes per TEAM.md
  - reviewer approved (if reviewer was spawned)
