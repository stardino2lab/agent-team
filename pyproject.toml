[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team"
version = "0.1.0"
description = "Windows-native multi-agent orchestrator for Claude and Codex CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "mcp>=1.0,<2",
    "pyyaml>=6.0",
    "textual>=1.0",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
agent-team = "agent_team.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_team = ["bundled/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Consumer-project fixtures carry their own src/ + tests/ (e.g. payment-api for
# the S10 E2E). They are data for our tests, not part of our own suite — don't
# collect them.
addopts = ["--ignore=tests/fixtures"]
markers = [
    "integration: tests requiring psmux in PATH",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixtures are sample consumer projects, not our code — keep our lint off them.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I"]
